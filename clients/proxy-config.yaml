# Copy of litellm/proxy/dev_config.yaml (identical at 3e086e25c9 and 428e320fee) with the model_list
# swapped for the one deployment under test, and router_settings plus
# general_settings.coordination_redis pointed at one dedicated Redis instance
model_list:
  - model_name: nodecode/nodecode-cyber-v1
    litellm_params:
      model: nodecode/nodecode-cyber-v1
      api_key: os.environ/NODECODE_API_KEY

router_settings:
  redis_host: 127.0.0.1
  redis_port: 6391

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  coordination_redis:
    host: 127.0.0.1
    port: 6391
  # Opt-in: let CheckBatchCost track cost for unmanaged batches created with a raw
  # gs:// (Vertex) or s3:// (Bedrock) input_file_id. Requires a matching deployment
  # configured for the batched model. Defaults to false.
  # track_unmanaged_batch_cost: true

sandbox_tools:
  - sandbox_tool_name: e2b_sandbox
    litellm_params:
      sandbox_provider: e2b
      api_key: os.environ/E2B_API_KEY

litellm_settings:
  drop_params: True
  code_interpreter_interception_params:
    enabled: true
    sandbox_tool_name: e2b_sandbox
  callbacks:
    - code_interpreter_interception
